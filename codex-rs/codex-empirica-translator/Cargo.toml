[package]
edition.workspace = true
license.workspace = true
name = "codex-empirica-translator"
version.workspace = true
description = "ecodex's protocol translator — bridges OpenAI Chat Completions providers (DeepSeek, Qwen, Kimi, Ollama, etc.) to codex's Responses API surface."
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "codex-empirica-translator"
path = "src/main.rs"

[lib]
name = "codex_empirica_translator"
path = "src/lib.rs"

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }

# Phase 1 (this commit): scaffold + resurrected source vendored as reference.
# Phase 2 (next session): wire imports against codex-api/codex-protocol pub
# surface, add tiny_http server, integration tests.
[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
reqwest = { workspace = true, features = ["blocking", "json", "stream", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tiny_http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
