# codex-empirica-translator multi-upstream config example.
#
# Pass to the translator via:
#   codex-empirica-translator --upstreams-config /path/to/upstreams.toml \
#     --bind 127.0.0.1:18080
#
# Or via env: ECODEX_TRANSLATOR_UPSTREAMS_CONFIG=/path/to/upstreams.toml
#
# Routing model: first-match-wins glob against the `model` field of the
# incoming Responses request. Use trailing `*` for prefix matches, exact
# strings for pinning, plain `*` for a catch-all. Put narrow patterns
# BEFORE catch-alls.

# Kimi For Coding — Anthropic surface bypasses the OpenAI X-Msh-Platform
# allowlist that blocks unregistered clients on api.kimi.com/coding/v1.
[[upstream]]
name = "kimi"
model_match = "kimi-*"
base_url = "https://api.kimi.com/coding/v1"
protocol = "anthropic"
api_key_env = "KIMI_API_KEY"

# DeepSeek — straight chat-completions over their public API.
# Uncomment + set DEEPSEEK_API_KEY in ~/.codex/.env to enable. Translator
# fails-loud at startup if api_key_env is unset, so leaving enabled-but-keyless
# upstreams will block the whole process.
# [[upstream]]
# name = "deepseek"
# model_match = "deepseek-*"
# base_url = "https://api.deepseek.com/v1"
# protocol = "chat"
# api_key_env = "DEEPSEEK_API_KEY"

