# Routes for codex-empirica-translator, which serves ecodex's Responses API on
# 127.0.0.1:18080 and forwards to providers that speak only Chat Completions or
# the Anthropic Messages API.
# Start it with `codex-empirica-translator` (no flags needed).
#
# Keys come from the environment variable named in api_key_env, or from the
# empirica key store ~/.empirica/credentials.yaml, where MISTRAL_API_KEY reads
#   mistral:
#     api_key: <your key>
# Never put a key in this file.
#
# ecodex writes this file only when it is missing, so your edits are kept.
# First match wins: put specific patterns before any catch-all.

[[upstream]]
name        = "mistral-devstral"
model_match = "devstral-*"
base_url    = "https://api.mistral.ai/v1"
protocol    = "chat"
api_key_env = "MISTRAL_API_KEY"

[[upstream]]
name        = "mistral-codestral"
model_match = "codestral-*"
base_url    = "https://api.mistral.ai/v1"
protocol    = "chat"
api_key_env = "MISTRAL_API_KEY"

[[upstream]]
name        = "mistral"
model_match = "mistral-*"
base_url    = "https://api.mistral.ai/v1"
protocol    = "chat"
api_key_env = "MISTRAL_API_KEY"

# The providers below speak Chat Completions. A route whose key is missing is
# skipped with a warning when the translator starts, so list them freely: add a
# key (credentials.yaml section in brackets) and restart the translator.

[[upstream]]
name        = "deepseek"           # key: deepseek.api_key
model_match = "deepseek-*"
base_url    = "https://api.deepseek.com/v1"
protocol    = "chat"
api_key_env = "DEEPSEEK_API_KEY"

[[upstream]]
name        = "qwen"               # key: dashscope.api_key
model_match = "qwen*"
base_url    = "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"   # dashscope.aliyuncs.com in mainland China
protocol    = "chat"
api_key_env = "DASHSCOPE_API_KEY"

[[upstream]]
name        = "glm"                # key: zhipu.api_key
model_match = "glm-*"
base_url    = "https://open.bigmodel.cn/api/paas/v4"
protocol    = "chat"
api_key_env = "ZHIPU_API_KEY"

[[upstream]]
name        = "kimi"               # key: moonshot.api_key
model_match = "kimi-*"
base_url    = "https://api.moonshot.cn/v1"
protocol    = "chat"
api_key_env = "MOONSHOT_API_KEY"

[[upstream]]
name        = "moonshot"           # key: moonshot.api_key
model_match = "moonshot-*"
base_url    = "https://api.moonshot.cn/v1"
protocol    = "chat"
api_key_env = "MOONSHOT_API_KEY"

# Anthropic speaks the Messages API, not Chat Completions; the translator's
# anthropic protocol sends x-api-key + anthropic-version to <base_url>/messages.
[[upstream]]
name        = "anthropic"          # key: anthropic.api_key
model_match = "claude-*"
base_url    = "https://api.anthropic.com/v1"
protocol    = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"
