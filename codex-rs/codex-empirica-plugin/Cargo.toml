[package]
edition.workspace = true
license.workspace = true
name = "codex-empirica-plugin"
version.workspace = true
description = "ecodex's empirica plugin host — codex hook integration that runs the epistemic Sentinel firewall, transaction lifecycle, and subagent routing."
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "codex-empirica-plugin"
path = "src/main.rs"

[lints]
workspace = true

[lib]
name = "codex_empirica_plugin"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
include_dir = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
toml_edit = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
