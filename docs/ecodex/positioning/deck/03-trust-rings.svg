<text x="64.0" y="688.0" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14.5px;font-weight:400;fill:#64748b;font-style:italic">Every actionable message traces to an ECO decision (the auth boundary). collab flows free; propose is gated. The agentic-web failure modes — injection cascades, spoofing, runaway action — don&#x27;t land.</text>
