# ecodex's forecast of its own next directions. `scripts/readme_sections.py` renders the open items as README's "What's Coming".
#
# This is a PREDICTION, not a promise, and it is graded:
#   * every item carries a confidence (0-1), the KIND of evidence its basis rests on, and the observation that would prove it wrong;
#   * the evidence kind caps the confidence (the renderer refuses a higher one):
#       measured  a command produced the figure and it was run for this forecast      up to 0.95
#       reviewed  read in the code or the data, not run                               up to 0.85
#       reported  someone else's report about code that may have changed since        up to 0.70
#       inferred  reasoned from patterns, nothing checked                             up to 0.60
#     Use the weakest kind any load-bearing part of the basis rests on;
#   * when a release ships an item, set `status: shipped` and `resolved_in: <version>`; when it is abandoned, `status: dropped` and
#     `resolved_in`. A prediction that was wrong when written is `retracted`; a replaced one is `superseded` with `superseded_by`;
#     `steered: true` means a goal for it already existed when it was predicted (delivering planned work is not foresight);
#   * after a release, a change to confidence, prediction, falsifier, horizon or evidence needs a dated entry under `revisions`
#     (on, from, to, reason), and an item is never deleted, only resolved;
#   * a falsifier must test the PREDICTION, not a neighbouring claim, and must be checkable by someone outside the project;
#   * the text is public: no proposal, goal, task or commit ids (the renderer refuses them).
#
# Same schema and rules as empirica core's docs/ROADMAP.yaml. Quote `made_in` and every `horizon`: an unquoted 0.170 loads as 0.17.

forecast:
  made_in: "0.164.2"
  made_on: "2026-10-26"

items:
  - id: docs-match-head
    title: README and docs match what ships
    prediction: By the 0.165.0 release, the README and the docs that describe Empirica behaviour match the code, including the bundled skill set, which skills are framework skills, and the removal of Shared Epistemic Records.
    confidence: 0.8
    evidence: reviewed
    basis: Reviewed in the docs. Since core 1.14.14 the constitution skill became an index over three new skills, Shared Epistemic Records were removed in favour of proposals with several targets, and a forecasting skill was added; some ecodex docs pages still describe the earlier state.
    falsifier: At the 0.165.0 tag, the README or a page under docs/ecodex names a skill that is not bundled in that tag, leaves a bundled skill out of a list that presents itself as complete, calls a skill a framework skill when its bundled SKILL.md is not pinned (or the reverse), or describes Shared Epistemic Records as a mechanism ecodex still uses.
    horizon: "0.165.0"
    steered: true
    status: predicted

  - id: upstream-0-165
    title: Upstream codex 0.165 within three days
    prediction: ecodex releases 0.165.0 within three days of upstream codex tagging 0.165.0 as stable.
    confidence: 0.7
    evidence: measured
    basis: ecodex 0.164.0 was tagged under four hours after upstream's rust-v0.164.0. Upstream's 0.165.0 alpha is already merged on a staging branch, builds, and passes the TUI suite apart from two snapshot tests that also fail on main.
    falsifier: More than three days pass between upstream's rust-v0.165.0 release and ecodex's v0.165.0 release on GitHub.
    horizon: "0.165.0"
    steered: true
    status: predicted

  - id: public-forecast
    title: The forecast is checked at every release
    prediction: From 0.165.0, the release step regenerates this section and refuses to release with a malformed or silently edited forecast.
    confidence: 0.8
    evidence: reviewed
    basis: A dry run of the release script checks the README and renders this section as releasing the next version would, before it bumps anything; CI runs the same check on pushes to main and on pull requests. Neither has run in a real release yet, and the first release that carries this file has no earlier forecast to compare against.
    falsifier: At the 0.165.0 tag, the release commit's README What's Coming differs from what scripts/readme_sections.py renders from that commit, or scripts/release.sh --dry-run does not stop when that tag's docs/ROADMAP.yaml is made invalid.
    horizon: "0.165.0"
    steered: true
    status: predicted

  - id: permission-roots
    title: Plugin writable roots survive a permission change
    prediction: In 0.165.0, choosing a permission profile mid-session keeps the writable roots the empirica plugin declares, and a test covers it.
    confidence: 0.7
    evidence: reviewed
    basis: Read in the code. A profile chosen mid-session is resolved again from config without the plugin's roots, which are only added when a session starts, so later writes to the plugin's state directory are refused by the sandbox.
    falsifier: In 0.165.0, a session that changes its permission profile mid-session cannot write to ~/.empirica, or no test changes the profile with a root-declaring plugin loaded.
    horizon: "0.165.0"
    steered: true
    status: predicted

  - id: rust-code-quality
    title: Graded code quality for Rust work
    prediction: By ecodex 0.165.1, a POSTFLIGHT run with a released empirica core grades Rust code quality and the owned-crate tests from ecodex's own quality sweep instead of reporting no source.
    confidence: 0.9
    evidence: measured
    basis: Measured with core's reader before its release. After ecodex's quality sweep wrote its files, a POSTFLIGHT graded code quality and the owned-crate tests from them, and core shipped that reader in a release on 26 October.
    falsifier: With ecodex 0.165.1 and the newest released empirica core installed, a POSTFLIGHT run after scripts/broccoli.sh passes reports no code-quality source or no test source.
    horizon: "0.165.1"
    steered: true
    status: predicted
