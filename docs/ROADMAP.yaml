# ecodex's forecast of its own next directions. `scripts/readme_sections.py` renders the open items as README's "What's Coming".
#
# This is a PREDICTION, not a promise, and it is graded:
#   * every item carries a confidence (0-1), the KIND of evidence its basis rests on, and the observation that would prove it wrong;
#   * the evidence kind caps the confidence (the renderer refuses a higher one):
#       measured  a command produced the figure and it was run for this forecast      up to 0.95
#       reviewed  read in the code or the data, not run                               up to 0.85
#       reported  someone else's report about code that may have changed since        up to 0.70
#       inferred  reasoned from patterns, nothing checked                             up to 0.60
#     Use the weakest kind any load-bearing part of the basis rests on;
#   * when a release ships an item, set `status: shipped` and `resolved_in: <version>`; when it is abandoned, `status: dropped` and
#     `resolved_in`. A prediction that was wrong when written is `retracted`; a replaced one is `superseded` with `superseded_by`;
#     `steered: true` means a goal for it already existed when it was predicted (delivering planned work is not foresight);
#   * after a release, a change to confidence, prediction, falsifier, horizon or evidence needs a dated entry under `revisions`
#     (on, from, to, reason), and an item is never deleted, only resolved;
#   * a falsifier must test the PREDICTION, not a neighbouring claim, and must be checkable by someone outside the project;
#   * the text is public: no proposal, goal, task or commit ids (the renderer refuses them).
#
# Same schema and rules as empirica core's docs/ROADMAP.yaml. Quote `made_in` and every `horizon`: an unquoted 0.170 loads as 0.17.

forecast:
  made_in: "0.167.1"
  made_on: "2026-11-11"

items:
  - id: docs-match-head
    title: README and docs match what ships
    prediction: By the 0.167.2 release, the README and the docs that describe Empirica behaviour match the code, including the bundled skill set, which skills are framework skills, and the removal of Shared Epistemic Records.
    confidence: 0.7
    evidence: reviewed
    basis: Reviewed in the docs. Since core 1.14.14 the constitution skill became an index over three new skills, Shared Epistemic Records were removed in favour of proposals with several targets, and a forecasting skill was added. At 0.167.1 the skills page names exactly the sixteen bundled skills, but dated experiment designs under docs/ecodex/experiments still describe Shared Epistemic Records as the mechanism they serve.
    falsifier: At the 0.167.2 tag, the README or a page under docs/ecodex names a skill that is not bundled in that tag, leaves a bundled skill out of a list that presents itself as complete, calls a skill a framework skill when its bundled SKILL.md is not pinned (or the reverse), or describes Shared Epistemic Records as a mechanism ecodex still uses.
    horizon: "0.167.2"
    steered: true
    status: predicted
    revisions:
      - "on": "2026-11-11"
        from: 0.8
        to: 0.7
        reason: There was no 0.165.0 release, so the horizon as written could not be met, and the next releases (0.167.0 and 0.167.1) went to the upstream fold-in, its audit fixes and its binaries. The skills list matches at 0.167.1; the Shared Epistemic Records language survives in dated experiment designs. The horizon moves to 0.167.2 and the confidence drops, because a prediction that misses its horizon was over-confident about when.

  - id: upstream-0-165
    title: Upstream codex 0.165 within three days
    prediction: ecodex releases 0.165.0 within three days of upstream codex tagging 0.165.0 as stable.
    confidence: 0.7
    evidence: measured
    basis: ecodex 0.164.0 was tagged under four hours after upstream's rust-v0.164.0. Upstream's 0.165.0 alpha is already merged on a staging branch, builds, and passes the TUI suite apart from two snapshot tests that also fail on main.
    falsifier: More than three days pass between upstream's rust-v0.165.0 release and ecodex's v0.165.0 release on GitHub.
    horizon: "0.165.0"
    steered: true
    status: dropped
    resolved_in: "0.167.1"
    reason: Graded at 0.167.1. Upstream tagged rust-v0.165.0 on 27 October and rust-v0.166.0 two days later; ecodex released neither, and its next release after 0.164.2 was 0.167.0 on 10 November, four and a half days after upstream's rust-v0.167.0. The basis was true when written (0.164.0 had followed upstream within four hours and the 0.165 alpha was staged), so this is a bet that missed, not a wrong premise; the three weeks went to the release pipeline, the cockpit and the mesh instead of tracking every upstream stable.

  - id: public-forecast
    title: The forecast is checked at every release
    prediction: From 0.165.0, the release step regenerates this section and refuses to release with a malformed or silently edited forecast.
    confidence: 0.8
    evidence: reviewed
    basis: A dry run of the release script checks the README and renders this section as releasing the next version would, before it bumps anything; CI runs the same check on pushes to main and on pull requests. Neither has run in a real release yet, and the first release that carries this file has no earlier forecast to compare against.
    falsifier: At the 0.165.0 tag, the release commit's README What's Coming differs from what scripts/readme_sections.py renders from that commit, or scripts/release.sh --dry-run does not stop when that tag's docs/ROADMAP.yaml is made invalid.
    horizon: "0.165.0"
    steered: true
    status: shipped
    resolved_in: "0.167.0"
    reason: Graded at 0.167.0, the first release after 0.164.2 (there was no 0.165.0). Both the 0.167.0 and the 0.167.1 cuts rendered this section through the release script before bumping anything, and CI checks every push to main against the last released forecast, so a silent edit fails the build. The refusal of an invalid file was exercised by the checker's own tests, not by breaking the file at a tag.

  - id: permission-roots
    title: Plugin writable roots survive a permission change
    prediction: In 0.167.2, choosing a permission profile mid-session keeps the writable roots the empirica plugin declares, and a test covers it.
    confidence: 0.6
    evidence: reviewed
    basis: Read in the code at 0.167.1. A profile chosen mid-session is resolved again from config without the plugin's roots, which are only added when a session starts, so later writes to the plugin's state directory are refused by the sandbox. The fix is in ecodex's own plugin-roots code, not upstream's.
    falsifier: In 0.167.2, a session that changes its permission profile mid-session cannot write to ~/.empirica, or no test changes the profile with a root-declaring plugin loaded.
    horizon: "0.167.2"
    steered: true
    status: predicted
    revisions:
      - "on": "2026-11-11"
        from: 0.7
        to: 0.6
        reason: There was no 0.165.0 release, and the defect is unchanged at 0.167.1, since the upstream fold-in touched neither the profile projection nor the plugin-roots enrichment. The horizon moves to 0.167.2 and the confidence drops, because a prediction that misses its horizon was over-confident about when.

  - id: rust-code-quality
    title: Graded code quality for Rust work
    prediction: By ecodex 0.167.2, a POSTFLIGHT run with a released empirica core grades Rust code quality and the owned-crate tests from ecodex's own quality sweep instead of reporting no source.
    confidence: 0.75
    evidence: measured
    basis: Measured with core's reader before its release. After ecodex's quality sweep wrote its files, a POSTFLIGHT graded code quality and the owned-crate tests from them, and core shipped that reader in a release on 26 October. The POSTFLIGHTs of the 0.167 releases listed artifacts, git and the codebase model as their sources, because the sweep's files were two weeks old. After a fresh sweep on 11 November, a POSTFLIGHT under core 1.15.1 listed code quality among its sources, but not the owned-crate tests; the test half is what remains to be seen.
    falsifier: With ecodex 0.167.2 and the newest released empirica core installed, a POSTFLIGHT run after scripts/broccoli.sh passes reports no code-quality source or no test source.
    horizon: "0.167.2"
    steered: true
    status: predicted
    revisions:
      - "on": "2026-11-11"
        from: 0.9
        to: 0.75
        reason: There was no 0.165.1 release, and at 0.167.1 the grading has not been observed with a released core because the sweep's files date from 26 October and the POSTFLIGHTs since name no code-quality or test source. The horizon moves to 0.167.2 and the confidence drops, because a prediction that misses its horizon was over-confident about when.

  - id: core-1-16-on-seats
    title: Core 1.16 reaches codex seats within two days
    prediction: Within two days of empirica core 1.16.0's release, ecodex 0.167.2 ships with its hooks re-vendored from it, so apply_patch gets discipline mode's small-edit budget on codex seats and planned goals carry due dates.
    confidence: 0.65
    evidence: reported
    basis: Core reports the apply_patch budget built on its development branch, with ecodex's hook payload shape confirmed (the patch text arrives in the command field), and the due-date half of goals released in 1.15.0. The re-vendor itself is a scripted step ecodex has run for every core release since 1.14.15, usually the same day. The two-day window is a bet on core's release landing when ecodex is not mid-fold-in.
    falsifier: More than two days pass between core's 1.16.0 release on GitHub and ecodex's v0.167.2 release, or in v0.167.2 an apply_patch that only adds or edits files inside the practice is refused by the Sentinel outside a transaction in discipline mode.
    horizon: "0.167.2"
    steered: true
    status: predicted

  - id: binaries-within-six-hours
    title: Every release ships all four binaries within six hours
    prediction: From 0.167.2 on, every ecodex release has its four binaries (Linux and macOS, x86_64 and arm64) attached to the GitHub release within six hours of the tag.
    confidence: 0.7
    evidence: measured
    basis: Measured on 0.167.1. The Linux builds take about an hour, the macOS builds about three (2 h 55 on the Intel runner, 3 h 05 on Apple Silicon), under the six-hour job limit the workflow now sets. The risk is GitHub's macOS arm64 pool, which refused the job twice in one day before a third attempt was picked up; the Intel pool was never short.
    falsifier: A release tag whose GitHub release still lacks one of the four tarballs six hours after the tag was pushed.
    horizon: "0.168.0"
    steered: false
    status: predicted

  - id: upstream-within-a-week
    title: Upstream stables folded in within a week
    prediction: From upstream codex's next stable tag on, ecodex releases its matching version within seven days of that tag.
    confidence: 0.5
    evidence: measured
    basis: Measured over the last three upstream stables. 0.164 was matched within four hours, 0.165 and 0.166 were skipped, and 0.167 was matched after four and a half days. A fold-in of 450 upstream commits took three working days including the audit, test and release-build fixes it surfaced, and a release-profile check now runs in CI so that class of miss costs no second release.
    falsifier: An upstream rust-v stable tag published after this forecast with no matching ecodex release seven days later.
    horizon: "0.168.0"
    steered: false
    status: predicted

  - id: decision-model-eval
    title: A local decision model is scored against the Sentinel
    prediction: By 0.169.0, ecodex carries an evaluation that runs a local decision model over the per-call decisions codex seats already record and reports its agreement with the Sentinel's gate per class of call.
    confidence: 0.5
    evidence: inferred
    basis: Reasoned from what exists. Since core 1.14.22 every gated call on a codex seat is recorded with its command class and outcome, which is the labelled data such an evaluation needs; the Strix Halo box serves local models through an OpenAI-compatible endpoint. Nothing of the evaluation itself is written yet, and no model has been chosen.
    falsifier: At the 0.169.0 tag, no script or page in the repository runs a decision model over recorded gate decisions and reports agreement per class.
    horizon: "0.169.0"
    steered: true
    status: predicted
