# Dependabot config — ecodex-specific.
#
# We deliberately keep this minimal. The upstream openai/codex config
# (archived as dependabot-upstream.yaml) covered bun, cargo, devcontainers,
# docker, github-actions, and rust-toolchain ecosystems — most of which
# are upstream-tailored noise for our fork:
#   - bun: targeted openai's custom .github/actions/codex (we archived
#     those to workflows-upstream/)
#   - cargo: workspace dep bumps would conflict with upstream syncs;
#     better to let cargo updates flow through `git rebase main` from
#     openai/codex
#   - devcontainers: we don't ship one
#   - docker: targeted codex-cli/ which we don't ship
#   - rust-toolchain: we don't have a rust-toolchain.toml
#
# We keep github-actions only — low conflict surface, high signal
# (security fixes for actions/checkout, actions/cache, dtolnay/rust-toolchain,
# etc. land cleanly and don't fight upstream).
#
# Re-enable other ecosystems when the contributor base is large enough
# to triage PRs at the cadence dependabot generates them.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
