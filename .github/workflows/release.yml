name: release-binaries

# Builds prebuilt, stripped ecodex binaries for every supported platform and
# attaches them to the GitHub Release for the pushed tag. This is what lets
# non-devs install without a Rust toolchain (Homebrew + the curl installer +
# the "Direct binary" download all consume these artifacts).
#
# Why this exists: `cargo install` / source build compiles the whole workspace
# (10-25 min) — a wall for non-technical users, especially on macOS where we
# previously shipped no binary at all. This produces per-OS/arch tarballs so
# nobody has to compile.
#
# Trigger: a `v*.*.*` tag (cut by scripts/release.sh Phase 1), or manual
# workflow_dispatch against an existing tag. Uploads append to the tag's
# GitHub Release (created by release.sh Phase 2, or created here if absent).

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build + attach binaries to (e.g. v0.2.6)"
        required: true
        type: string

concurrency:
  group: release-binaries-${{ github.ref_name }}-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120   # cold-cache release build incl. codex-code-mode-host's v8 dep is slow on 2-core runners
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14         # Apple Silicon, standard hosted
          - target: x86_64-apple-darwin
            runner: macos-14         # cross-compile x86_64 on Apple Silicon (macos-13 Intel runners are scarce/deprecated)
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04     # older glibc (2.35) host = broad forward-compat
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm # native ARM hosted runner (GA)
    steps:
      - name: Checkout ${{ inputs.tag || github.ref_name }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Install pinned Rust toolchain + target
        working-directory: codex-rs
        run: |
          set -euo pipefail
          rustup show                       # installs channel from rust-toolchain.toml
          rustup target add ${{ matrix.target }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
          key: release-${{ matrix.target }}

      - name: Build release binaries
        working-directory: codex-rs
        env:
          CARGO_TERM_COLOR: always
        run: |
          set -euo pipefail
          cargo build --release --target ${{ matrix.target }} \
            -p codex-cli -p codex-empirica-plugin -p codex-empirica-translator

      - name: Fetch upstream codex-code-mode-host
        # codex-code-mode-host is unmodified upstream code (verified: zero
        # ecodex commits touch code-mode-host/-runtime/-protocol post-merge).
        # We don't build it ourselves: its codex-code-mode-runtime dependency
        # needs the v8 crate's `v8_enable_sandbox` feature, and rusty_v8 has
        # never published a prebuilt "*_sandbox_*" archive for ANY platform
        # (checked the last 15 releases) — building it requires a from-source
        # V8 compile (hours, depot_tools/gn/ninja) that upstream's own CI
        # clearly has infra for but we don't. Upstream already publishes the
        # exact binary we need on their GitHub release for the tag we synced
        # from — use that instead of re-solving their build problem.
        working-directory: codex-rs
        env:
          UPSTREAM_TAG_FILE: UPSTREAM_SYNC_TAG
        run: |
          set -euo pipefail
          UPSTREAM_TAG="$(tr -d ' \t\n' < "${UPSTREAM_TAG_FILE}")"
          TARGET="${{ matrix.target }}"
          case "${TARGET}" in
            *-unknown-linux-gnu) UPSTREAM_TARGET="${TARGET%-gnu}-musl" ;; # upstream ships static musl for linux; runs fine on gnu hosts
            *) UPSTREAM_TARGET="${TARGET}" ;;
          esac
          ASSET="codex-code-mode-host-${UPSTREAM_TARGET}.tar.gz"
          URL="https://github.com/openai/codex/releases/download/${UPSTREAM_TAG}/${ASSET}"
          echo "fetching ${URL}"
          curl -fsSL -o "${ASSET}" "${URL}"
          mkdir -p "upstream-code-mode-host"
          tar -xzf "${ASSET}" -C "upstream-code-mode-host"
          FETCHED="upstream-code-mode-host/codex-code-mode-host-${UPSTREAM_TARGET}"
          [ -s "${FETCHED}" ] || { echo "downloaded binary is empty or missing: ${FETCHED}" >&2; exit 1; }
          file "${FETCHED}" | grep -qi 'ELF\|Mach-O' || { echo "downloaded file is not a recognizable binary: ${FETCHED}" >&2; exit 1; }
          mkdir -p "target/${TARGET}/release"
          cp "${FETCHED}" "target/${TARGET}/release/codex-code-mode-host"
          chmod +x "target/${TARGET}/release/codex-code-mode-host"

      - name: Stage, strip, and archive
        id: archive
        working-directory: codex-rs
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          OUTDIR="target/${TARGET}/release"
          STAGE="ecodex-${TARGET}"
          mkdir -p "${STAGE}"
          cp "${OUTDIR}/ecodex" "${OUTDIR}/codex-empirica-plugin" "${OUTDIR}/codex-empirica-translator" "${OUTDIR}/codex-code-mode-host" "${STAGE}/"

          # profile.release keeps strip=false (symbols retained for packaging);
          # strip explicitly here so the shipped artifact is small (~300MB -> tens of MB).
          # macOS uses `strip -x` (external symbols only) so the code still runs.
          # codex-code-mode-host is upstream-prebuilt and already stripped; a
          # re-strip is a harmless no-op, kept for one uniform command.
          if [[ "${TARGET}" == *apple-darwin* ]]; then
            strip -x "${STAGE}/ecodex" "${STAGE}/codex-empirica-plugin" "${STAGE}/codex-empirica-translator" "${STAGE}/codex-code-mode-host"
          else
            strip "${STAGE}/ecodex" "${STAGE}/codex-empirica-plugin" "${STAGE}/codex-empirica-translator" "${STAGE}/codex-code-mode-host"
          fi

          ARCHIVE="ecodex-${TARGET}.tar.gz"
          tar -czf "${ARCHIVE}" -C "${STAGE}" .
          shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
          echo "archive=codex-rs/${ARCHIVE}" >> "${GITHUB_OUTPUT}"
          echo "checksum=codex-rs/${ARCHIVE}.sha256" >> "${GITHUB_OUTPUT}"
          ls -lh "${ARCHIVE}"

      - name: Ensure release exists + upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" \
              --title "ecodex ${TAG}" --notes "Prebuilt binaries. See CHANGELOG.md." || true
          fi
          gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" --clobber \
            "${{ steps.archive.outputs.archive }}" "${{ steps.archive.outputs.checksum }}"
