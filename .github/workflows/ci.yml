name: CI

on:
  push:
    branches: [main, build/v1-plugin]
  pull_request:
    branches: [main, build/v1-plugin]

env:
  CARGO_TERM_COLOR: always
  # Mirrors scripts/release.sh gate_test: 16MB test-thread stack avoids
  # SIGABRT on workspace tests with recursive subtree walks.
  RUST_MIN_STACK: 16777216

jobs:
  build-test-clippy:
    name: Build + test + clippy (scoped to ecodex-owned crates)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            codex-rs/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('codex-rs/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # ── Build (release profile) ──────────────────────────────────────
      # Mirrors scripts/release.sh gate_build. Scopes to the three crates
      # we ship: codex-cli produces the `ecodex` binary, plus our two
      # owned crates. Building these covers all our redistributed code
      # (their transitive deps include the upstream codex internals).
      - name: Build (release)
        working-directory: codex-rs
        run: >
          cargo build --release
          -p codex-cli
          -p codex-empirica-plugin
          -p codex-empirica-translator

      # ── Test (scoped to owned crates + binary) ───────────────────────
      # Mirrors scripts/release.sh gate_test. Does NOT run --workspace
      # --lib: upstream codex has 100+ crates with tests that fail in
      # CI environments for reasons unrelated to ecodex (env-dependent
      # config snapshots, network-proxy timeouts). Those are upstream's
      # responsibility. See goal 0309b0ad for the upstream-test
      # investigation track.
      - name: Test (lib, owned + binary)
        working-directory: codex-rs
        run: >
          cargo test --lib
          -p codex-cli
          -p codex-empirica-plugin
          -p codex-empirica-translator

      # ── Clippy (workspace, warnings allowed) ─────────────────────────
      # Tx-AV cleared clippy errors to 0 after the rust 1.93 upgrade.
      # We run clippy on the workspace (catches regressions across the
      # surface we redistribute) but don't gate on warnings — David's
      # call: cleanup, not policy.
      - name: Clippy
        working-directory: codex-rs
        run: cargo clippy --workspace --all-targets
