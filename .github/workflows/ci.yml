name: ci

# Curated ecodex CI.
#
# Replaces openai/codex's inherited workflows, which test codex's *repo
# invariants* (TUI<->core boundary, Bazel/Cargo clippy parity, npm staging from
# openai's own release runs, README ASCII house-style) rather than validating
# ecodex's value. The inherited `ci` job didn't even run cargo — ecodex's own
# code went untested on push.
#
# This gate builds + tests the crates ecodex actually owns and publishes: the
# empirica plugin (Sentinel/hook translation, the firewall) and the protocol
# translator. Same scope as `scripts/release.sh`'s gate-test. The full upstream
# workspace is intentionally out of scope — those are openai's crates, tracked
# via the `upstream` remote.
on:
  pull_request: {}
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owned-crates:
    name: build + test owned crates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # rust-toolchain.toml pins channel 1.95.0 + clippy/rustfmt/rust-src;
      # `rustup show` (run inside codex-rs) installs the pinned toolchain.
      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs

      - name: Build + test owned crates
        run: cargo test -p codex-empirica-plugin -p codex-empirica-translator

      - name: Check Hugging Face integration contract
        working-directory: .
        run: |
          python3 scripts/check_huggingface_integration.py
          python3 scripts/test_huggingface_integration.py
          cd codex-rs
          cargo test -p codex-skills-extension hugging_face_cli_skill_in_global_agents_root_is_discovered

  vendored-firewall-invariants:
    name: vendored firewall drift-guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # The CLI-parity and SQL-schema guards use Empirica's production parser
      # and schema as their instruments. Pin the exact source revision the
      # vendored hook snapshot matches; an absent instrument must fail, not
      # turn those guards into passing skips.
      - name: Checkout matching Empirica core
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: EmpiricaAI/empirica
          ref: f0e083c87523f8165c2623b568421ef079462d02
          path: empirica-core
          persist-credentials: false

      # setup-codex.py re-vendors empirica's (genericized) hooks, so a content
      # diff vs empirica is noisy by design. This guard instead asserts the
      # firewall's security-critical behaviours are PRESENT in the vendored
      # copy — catching a re-vendor/edit that silently drops one (the failure
      # class behind the v0.2.0 fail-open + the PR#138 recovery-hoist scare).
      # Pure file inspection; no empirica dependency, no Rust build.
      - name: Check vendored firewall invariants
        run: python3 scripts/check_vendored_firewall.py

      - name: Run hermetic vendored-hook tests
        run: |
          python3 -m venv "$RUNNER_TEMP/vendored-hooks-venv"
          "$RUNNER_TEMP/vendored-hooks-venv/bin/python" -m pip install \
            --disable-pip-version-check pytest==8.3.5 "$GITHUB_WORKSPACE/empirica-core"
          "$RUNNER_TEMP/vendored-hooks-venv/bin/python" -c \
            'from empirica.cli.cli_core import create_argument_parser; assert create_argument_parser()'
          "$RUNNER_TEMP/vendored-hooks-venv/bin/python" -m pytest \
            codex-rs/codex-empirica-plugin/tests/vendored_hooks/ -v
