name: CI

on:
  push:
    branches: [main, build/v1-plugin]
  pull_request:
    branches: [main, build/v1-plugin]

env:
  CARGO_TERM_COLOR: always
  # Mirrors scripts/release.sh gate_test: 16MB test-thread stack avoids
  # SIGABRT on workspace tests with recursive subtree walks.
  RUST_MIN_STACK: 16777216

jobs:
  build-test-clippy:
    name: Build + test + clippy (scoped to ecodex-owned crates)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            codex-rs/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('codex-rs/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # ── Build (debug profile) ────────────────────────────────────────
      # Debug build is 2-5x faster than release. CI's job is to validate
      # that code compiles + tests pass; binary optimization happens in
      # release.yml on tag push. Scoped to the three crates we ship so
      # we still pull all our redistributed surface through the compiler.
      - name: Build (debug)
        working-directory: codex-rs
        run: >
          cargo build
          -p codex-cli
          -p codex-empirica-plugin
          -p codex-empirica-translator

      # ── Test (scoped to owned crates + binary) ───────────────────────
      # Mirrors scripts/release.sh gate_test. Does NOT run --workspace
      # --lib: upstream codex has 100+ crates with tests that fail in
      # CI environments for reasons unrelated to ecodex (env-dependent
      # config snapshots, network-proxy timeouts). Those are upstream's
      # responsibility. See goal 0309b0ad for the upstream-test
      # investigation track.
      - name: Test (lib, owned + binary)
        working-directory: codex-rs
        run: >
          cargo test --lib
          -p codex-cli
          -p codex-empirica-plugin
          -p codex-empirica-translator

      # ── Clippy (scoped to owned crates) ──────────────────────────────
      # Originally `--workspace --all-targets`, but that walks ~130
      # transitive crates and pushed CI past the 45min ceiling on cold
      # cache (Tx-BU finding 187fcdce). Scoped to the same set as
      # test/build — keeps us honest about lints in code we own +
      # redistribute via our binary, lets upstream lints be upstream's
      # problem (already filtered out of release.sh's gate_clippy in
      # practice — same scoping rationale as gate_test).
      - name: Clippy
        working-directory: codex-rs
        run: >
          cargo clippy
          -p codex-cli
          -p codex-empirica-plugin
          -p codex-empirica-translator
          --all-targets
